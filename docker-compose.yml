version: "3.9"

services:
  janus:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      # Override these via a .env file or Docker secrets — never hardcode here
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgres://janus:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-janus_production}}
      - APP_ID=${APP_ID:-janus-dev-app}
      - APP_SECRET=${APP_SECRET:-some-jwt-signing-secret-key-32-chars-long}
      - AUTH_URL=${AUTH_URL:-http://localhost:9999}
      - AUTH_PLATFORM_URL=${AUTH_PLATFORM_URL:-http://localhost:9999}
      - OWNER_UNION_ID=${OWNER_UNION_ID:-admin-union-id}
      - PLACE_ORDERS=${PLACE_ORDERS:-false}
      - AUTO_EXECUTE=${AUTO_EXECUTE:-false}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-697b9bab1a69ab938175a642ca0a71d2913301dc05a18e14350fbd6616fdb963}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://localhost:11434}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs          # persist logs across restarts
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janus_production}
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data    # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-janus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: daily DB backups to a local directory
  pgbackup:
    image: ankane/pgvector:latest
    restart: "no"
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "pg_dump -h postgres -U ${POSTGRES_USER:-janus} ${POSTGRES_DB:-janus_production}
             | gzip > /backups/janus_$$(date +%Y%m%d_%H%M%S).sql.gz
             && echo 'Backup complete'"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
